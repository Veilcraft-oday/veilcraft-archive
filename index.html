<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leas Team | Anne Bonnys Schatz</title>

  <link href="https://fonts.googleapis.com/css2?family=Eczar:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css" />
  <script defer src="assets/script.js"></script>
</head>
<body>
  <div class="veilcraft-container fade-in">
    <h1 class="message">Anne Bonnys Schatz</h1>
    <p class="subtext">
      Nur echte Schatzsucher dürfen weiter.<br>
      Gib das geheime Lösungswort ein.
    </p>

    <form id="code-form" class="code-form" autocomplete="off">
      <input
        type="text"
        id="code-input"
        name="code"
        placeholder="Lösungswort eingeben"
        aria-label="Lösungswort eingeben"
        maxlength="20"
      />
      <button type="submit">Schatztruhe öffnen</button>
    </form>

    <p id="feedback" class="feedback" aria-live="polite"></p>

    <div id="lea-placeholder"></div>
  </div>

  <!-- Background Effects -->
  <div class="gradient-background">
    <div class="gradient-sphere sphere-1" aria-hidden="true"></div>
    <div class="gradient-sphere sphere-2" aria-hidden="true"></div>
    <div class="gradient-sphere sphere-3" aria-hidden="true"></div>
    <div class="glow" aria-hidden="true"></div>
    <div class="grid-overlay" aria-hidden="true"></div>
    <div class="noise-overlay" aria-hidden="true"></div>
    <div class="particles-container" id="particles-container" aria-hidden="true"></div>
  </div>

  <!-- Audio -->
  <audio id="bg-audio" loop>
    <source src="assets/WRinstr.mp3" type="audio/mpeg" />
  </audio>
</body>
</html>
