<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Veilcraft | The Gate</title>
  <link rel="stylesheet" href="assets/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Eczar:wght@400;700&display=swap" rel="stylesheet" />
  <script defer src="assets/script.js"></script>
</head>
<body>
  <form id="gate-form">
  <input id="gate-input" type="text" />
  <button type="submit">Open the Veil</button>
  <p id="gate-feedback" class="error-text"></p>
</form>
  <div class="veil-bg" aria-hidden="true"></div>

  <main class="veil-container">
    <h1>The Veil Remembers</h1>
    <p class="veil-text">Enter the mark that opens the path.</p>

    <input id="gate-password" type="text" placeholder="Enter the sign..." autocomplete="off" />
    <button id="gate-submit">Open the Veil</button>

    <p id="gate-error" class="error-text">The veil remains closed.</p>
  </main>
  <!-- Audio -->
  <audio id="bg-audio" loop>
    <source src="assets/WRinstr.mp3" type="audio/mpeg" />
  </audio>
</body>
</html>
