<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Veilcraft | The Quadrumvirate Returns</title>
  <link rel="stylesheet" href="assets/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Eczar:wght@400;700&display=swap" rel="stylesheet" />
  <script defer src="assets/script.js"></script>

  <style>
    .video-bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      filter: brightness(0.55);
    }

    .finale-container {
      position: relative;
      z-index: 10;
      text-align: center;
      background: rgba(0, 0, 0, 0.68);
      border: 1px solid rgba(168, 74, 226, 0.35);
      border-radius: 14px;
      padding: 2.5rem;
      box-shadow: 0 0 35px rgba(168, 74, 226, 0.25);
      width: min(100%, 720px);
    }

    .music-icons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 2rem;
      margin-top: 2rem;
      flex-wrap: wrap;
    }

    .music-icon {
      display: inline-block;
      position: relative;
      z-index: 20;
    }

    .music-icon img {
      width: 82px;
      height: auto;
      transition: transform 0.3s ease, filter 0.3s ease;
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.25));
    }

    .music-icon:hover img {
      transform: scale(1.12);
      filter: drop-shadow(0 0 18px rgba(192, 115, 255, 0.9));
    }

    .particles-container {
      z-index: 2;
    }
  </style>
</head>

<body>
  <video
  class="video-bg"
  autoplay
  muted
  loop
  playsinline
  webkit-playsinline
  poster="assets/finale-poster.png"
>
  <source
    src="assets/finale-portrait.mp4"
    type="video/mp4"
    media="(orientation: portrait)"
  />

  <source
    src="assets/finale-landscape.mp4"
    type="video/mp4"
    media="(orientation: landscape)"
  />
</video>

  <div class="particles-container" id="particles-container" aria-hidden="true"></div>

  <main class="finale-container">
    <h1>The Quadrumvirate Returns</h1>

    <p class="veil-text">
      The veil has opened.<br>
      The lantern stayed lit.
    </p>

    <div class="music-icons">
      <a
        href="https://music.youtube.com/channel/UCSaYEkpukaeIb_tEXVofWNA?si=Jppa4bXWmtZqSBTT"
        target="_blank"
        class="music-icon"
        aria-label="Listen on YouTube Music"
      >
        <img src="assets/youtube.svg" alt="YouTube Music" />
      </a>

      <a
        href="https://open.spotify.com/artist/3sOJrHZ3oAeeEGKmkIhjqC?si=_Zuv0J1SQO6GB9o0UIRojw"
        target="_blank"
        class="music-icon"
        aria-label="Listen on Spotify"
      >
        <img src="assets/spotify.svg" alt="Spotify" />
      </a>

      <a
        href="https://music.amazon.de/artists/B0FDJQ4YQN/veilcraft?marketplaceId=A1PA6795UKMFR9&musicTerritory=DE&ref=dm_sh_exofvqvphz3p6m4yGo0XTIAVk"
        target="_blank"
        class="music-icon"
        aria-label="Listen on Amazon Music"
      >
        <img src="assets/amazon.png" alt="Amazon Music" />
      </a>
    </div>
  </main>
   <audio id="bg-audio" loop>
    <source src="assets/Lantern.mp3" type="audio/mpeg" />
  </audio>
</body>
</html>
