<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Discord in July</title>
  <link rel="stylesheet" href="assets/style.css" />
  <script src="assets/script.js" defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Eczar:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    .discord-container {
      z-index: 10;
      background: rgba(0, 0, 0, 0.7);
      padding: 2rem;
      border-radius: 10px;
      text-align: center;
      max-width: 700px;
      margin: 10vh auto;
    }

    .discord-title {
      font-size: 2.5rem;
      font-family: 'Eczar', serif;
      margin-bottom: 1rem;
      background: linear-gradient(to right, #fff, #aaa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .discord-text {
      font-size: 1.2rem;
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 1.5rem;
      font-family: 'Eczar', serif;
    }

    .discord-subtext {
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.6);
      font-style: italic;
      margin-bottom: 2rem;
      font-family: 'Eczar', serif;
    }

    .discord-image {
      max-width: 100%;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(168, 74, 226, 0.4);
    }
  </style>
</head>
<body>

  <!-- Background Effects -->
  <div class="gradient-background">
    <div class="gradient-sphere sphere-1" aria-hidden="true"></div>
    <div class="gradient-sphere sphere-2" aria-hidden="true"></div>
    <div class="gradient-sphere sphere-3" aria-hidden="true"></div>
    <div class="glow" aria-hidden="true"></div>
    <div class="grid-overlay" aria-hidden="true"></div>
    <div class="noise-overlay" aria-hidden="true"></div>
    <div class="particles-container" id="particles-container" aria-hidden="true"></div>
  </div>

  <!-- Main Content -->
  <div class="discord-container">
    <h1 class="discord-title">Discord in July</h1>
    <p class="discord-text">
      I had a discord with the one who named this month on how many days are left until me — <strong>Oday</strong> — will emerge again.
    </p>
    <p class="discord-subtext">
      Announce my arrival over the usual channel.
    </p>
    <img src="assets/sq_(h)int.webp" alt="Discord Clue" class="discord-image" />
  </div>

</body>
</html>
