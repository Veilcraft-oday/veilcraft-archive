<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Veilcraft | Reward</title>
  <link rel="stylesheet" href="assets/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Eczar:wght@400;700&display=swap" rel="stylesheet" />
  <script defer src="assets/script.js"></script>
</head>
<body>
  <div class="veil-bg" aria-hidden="true"></div>

  <div class="gradient-sphere sphere-1" aria-hidden="true"></div>
  <div class="gradient-sphere sphere-2" aria-hidden="true"></div>
  <div class="gradient-sphere sphere-3" aria-hidden="true"></div>
  <div class="particles-container" id="particles-container" aria-hidden="true"></div>

  <main class="veil-container reward-container">
    <p class="seal-mark">🜃</p>

    <h1>The Path Opens</h1>

    <p class="veil-text">
      You found what broke through the veil.
    </p>

    <p class="reward-lines">
      The ghosts have not vanished.<br>
      They are waiting to be carried forward.
    </p>

    <div class="ritual-instruction">
      <p>Write the name of the first Primal Ghost in the channel to receive your reward.</p>
      <strong>Varr</strong>
    </div>
  </main>
</body>
</html>
